# Blueprint: Render Dashboard → New → Blueprint → this repo
# Or create the web service manually using the same commands.
services:
  - type: web
    name: quantumy
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_RISC_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_RISC_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false

  - type: cron
    name: quantumy-notes-reminders
    runtime: node
    schedule: "0 13 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
