<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="pearl" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e8eaf0"/>
      <stop offset="70%" stop-color="#b8bcc8"/>
      <stop offset="100%" stop-color="#8a90a0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
    </filter>
  </defs>
  <!-- back ring -->
  <ellipse cx="64" cy="70" rx="52" ry="14" fill="none" stroke="url(#ringA)" stroke-width="7" transform="rotate(-22 64 64)" opacity="0.55"/>
  <!-- sphere -->
  <circle cx="64" cy="64" r="36" fill="url(#pearl)"/>
  <!-- soft highlight -->
  <ellipse cx="52" cy="48" rx="14" ry="10" fill="#ffffff" opacity="0.35"/>
  <!-- front ring -->
  <ellipse cx="64" cy="58" rx="52" ry="14" fill="none" stroke="url(#ringA)" stroke-width="7" transform="rotate(-22 64 64)" opacity="0.95"/>
</svg>
